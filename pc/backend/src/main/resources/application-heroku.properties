server.port=${PORT:8080}

# Heroku Postgres (auto-configured via DATABASE_URL)
spring.datasource.url=${DATABASE_URL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# External ML service
ml.service.url=${ML_SERVICE_URL:https://digiscribe-ml.herokuapp.com/api}

# CORS Configuration
cors.allowed.origins=${CORS_ORIGINS:https://digiscribe-frontend.herokuapp.com}

# Security
spring.h2.console.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.digiscrib=INFO
