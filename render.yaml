services:
  # Backend (Spring Boot)
  - type: web
    name: digiscribe-backend
    runtime: java
    rootDir: pc/backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/digiscrib-1.0.0.jar --spring.profiles.active=render --server.port=$PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digiscribe-db
          property: connectionString
      - key: ML_SERVICE_URL
        value: https://digiscribe-ml.onrender.com/api
      - key: CORS_ORIGINS
        value: https://digiscribe-frontend.onrender.com

  # ML Service (Python FastAPI)
  - type: web
    name: digiscribe-ml
    runtime: python
    rootDir: pc/ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mnist_service:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend (Vue 3)
  - type: web
    name: digiscribe-frontend
    runtime: static
    rootDir: pc/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://digiscribe-backend.onrender.com
      - key: VITE_ENV
        value: production

databases:
  - name: digiscribe-db
    databaseName: digiscribe
    user: digiscribe_user
    plan: free
