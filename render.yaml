services:
  # ML Service (Python FastAPI)
  - type: web
    name: digiscribe-ml
    runtime: python
    rootDir: pc/ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mnist_service:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend (Vue 3)
  - type: web
    name: digiscribe-frontend
    runtime: static
    rootDir: pc/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: REPLACE_WITH_BACKEND_URL
      - key: VITE_ENV
        value: production

databases:
  - name: digiscribe-db
    databaseName: digiscribe
    user: digiscribe_user
    plan: free
